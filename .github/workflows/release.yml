            --app-drop-link 425 190 \
            "Antra-macOS-Intel.dmg" \
            "$APP"

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antra-macOS-Intel
          path: Antra-macOS-Intel.dmg

  release:
    name: Upload to Release
    needs: [build-windows, build-linux, build-macos, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            ## What's New

            - **Animated Logo** — new circuit-board "A" logo with orbiting service icons (Spotify, Apple Music, Amazon, Tidal, Deezer, and more) on the welcome screen
            - **Streamlined Setup** — the first-run screen now shows only the folder picker; everything else lives in dedicated panels
            - **Folder Structure Panel** — new 📁 nav button opens Library Mode, Folder Structure, and Filename Format settings
            - **Settings Focused** — ⚙️ settings trimmed to API key, failed-track retries, and sources
            - **New Source Adapters** — Deezer, Tidal, and Qobuz mirror adapters; YouTube via yt-dlp
            - **Core Engine Improvements** — resolver, organiser, tagger, and transcoder improvements across the board
            - **Community** — join us on [Telegram](https://t.me/antraaverse) · support on [Patreon](https://patreon.com/AntraVerse)

            ## Downloads

            [![Windows](https://img.shields.io/github/downloads/anandprtp/Antra/${{ steps.tag.outputs.tag }}/Antra.exe?display_name=true&logo=windows&label=Windows&style=for-the-badge&color=0078D6)](https://github.com/anandprtp/Antra/releases/download/${{ steps.tag.outputs.tag }}/Antra.exe)
            [![macOS Apple Silicon](https://img.shields.io/github/downloads/anandprtp/Antra/${{ steps.tag.outputs.tag }}/Antra-macOS.dmg?display_name=true&logo=apple&label=macOS+Apple+Silicon&style=for-the-badge&color=111111)](https://github.com/anandprtp/Antra/releases/download/${{ steps.tag.outputs.tag }}/Antra-macOS.dmg)
            [![macOS Intel](https://img.shields.io/github/downloads/anandprtp/Antra/${{ steps.tag.outputs.tag }}/Antra-macOS-Intel.dmg?display_name=true&logo=apple&label=macOS+Intel&style=for-the-badge&color=555555)](https://github.com/anandprtp/Antra/releases/download/${{ steps.tag.outputs.tag }}/Antra-macOS-Intel.dmg)
            [![Linux](https://img.shields.io/github/downloads/anandprtp/Antra/${{ steps.tag.outputs.tag }}/Antra-Linux.AppImage?display_name=true&logo=linux&label=Linux&style=for-the-badge&color=FCC624&logoColor=black)](https://github.com/anandprtp/Antra/releases/download/${{ steps.tag.outputs.tag }}/Antra-Linux.AppImage)

            ## Files

            - `Antra.exe`: Windows
            - `Antra-Linux.AppImage`: Linux
            - `Antra-macOS.dmg`: macOS Apple Silicon
            - `Antra-macOS-Intel.dmg`: macOS Intel

            <details>
            <summary>Linux install</summary>

            Download `Antra-Linux.AppImage`, then install the WebKit dependency for your distro:

            **Ubuntu/Debian:**
            ```
            sudo apt install libwebkit2gtk-4.1-0
            ```
            **Arch Linux:**
            ```
            sudo pacman -S webkit2gtk-4.1
            ```
            **Fedora:**
            ```
            sudo dnf install webkit2gtk4.1
            ```

            Then make executable and run:
            ```bash
            chmod +x Antra-Linux.AppImage
            ./Antra-Linux.AppImage
            ```

            If Ubuntu blocks running it from `~/Downloads`, move it first:
            ```bash
            mv ~/Downloads/Antra-Linux.AppImage ~/
            cd ~
            chmod +x Antra-Linux.AppImage
            ./Antra-Linux.AppImage
            ```

            </details>

            <details>
            <summary>macOS install</summary>

            Download the DMG for your Mac (`Antra-macOS.dmg` for Apple Silicon, `Antra-macOS-Intel.dmg` for Intel), open it, and drag `Antra` into your `Applications` folder.

            On first launch, macOS may block the app with an "Apple could not verify" warning. To open it:

            1. Open `Applications`
            2. Right-click `Antra`
            3. Click `Open`
            4. Click `Open` again in the warning dialog

            Useful notes for macOS:

            - If the app still does not open, go to `System Settings -> Privacy & Security` and click `Open Anyway` if that option appears.
            - You may need to move the app out of the DMG and into `Applications` before opening it.
            - This build is not notarized yet, so the first-run security prompt is expected.

            </details>
          files: |
            dist/Antra-Windows/Antra.exe
            dist/Antra-Linux/Antra-Linux.AppImage
            dist/Antra-macOS/Antra-macOS.dmg
            dist/Antra-macOS-Intel/Antra-macOS-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
