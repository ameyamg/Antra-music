          # Hardcoding it is what made the first version of this test fail here.
          probe=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
          cache_path=$(echo "$probe" | python3 -c "import json,sys; print(json.load(sys.stdin)['cache_path'])")
          echo "backend reads its cache from: $cache_path"
          mkdir -p "$(dirname "$cache_path")"
          printf '%s' '{"hifi": [], "amazon": [], "apple": [], "mirrors": {"tidal": "https://tidal.example.test", "qobuz": "https://qobuz.example.test"}, "api_key": "ak_test"}' > "$cache_path"
          out=$(ANTRA_ENDPOINT_MANIFEST_DISABLED=1 ./runtime/backend/AntraBackend --debug-manifest 2>&1)
          echo "$out"
          resolved=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('resolved_tidal',''))")
          data_dir=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data_dir',''))")
          if [ "$resolved" != "https://tidal.example.test" ]; then
            echo "endpoint manifest cache not resolved from the persistent path - refusing to publish"; exit 1
          fi
          case "$data_dir" in *_MEI*|/tmp/*) echo "app-data dir resolved inside a temp directory - refusing to publish"; exit 1 ;; esac
          echo "endpoint manifest cache smoke test OK"

      - name: Build Wails App
        working-directory: antra-wails
        run: wails build -clean

      - name: Package as DMG
        run: |
          APP=$(find antra-wails/build/bin -maxdepth 1 -name "*.app" | head -1)
          create-dmg \
            --volname "Antra" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$(basename $APP)" 175 190 \
            --hide-extension "$(basename $APP)" \
            --app-drop-link 425 190 \
            "Antra-macOS.dmg" \
            "$APP"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antra-macOS
          path: Antra-macOS.dmg

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-15-intel
    env:
      WAILS_VERSION: v2.12.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antra-wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python Dependencies
        run: pip install -r requirements-desktop.txt

      - name: Install macOS Dependencies
        run: brew install create-dmg upx || true

      - name: Install Wails CLI
